[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrievaliq"
version = "1.0.0"
description = "Cost-aware adaptive retrieval engine with evaluation and dashboard"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.36", "scikit-learn>=1.4", "numpy>=1.26", "pandas>=2.1", "plotly>=5.22", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
